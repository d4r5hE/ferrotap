name: Release

# Publishes a GitHub Release with built Windows binaries whenever you push a
# version tag, e.g.:
#     git tag v0.1.0
#     git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binaries
        run: cargo build --release --bin ferrotap --bin ferrotap_proxy --bin ferrotap_mcp

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "ferrotap-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/ferrotap.exe,target/release/ferrotap_proxy.exe,target/release/ferrotap_mcp.exe,README.md,LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ASSET" --title "Ferrotap ${{ github.ref_name }}" --generate-notes
